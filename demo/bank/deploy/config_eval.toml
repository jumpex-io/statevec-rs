[engine]
mode = "single-host"
build_profile = "evaluation"
state_memory_limit_mb = __STATE_MEMORY_LIMIT_MB__

[storage]
data_dir = "__STATEVEC_DATA_DIR__"

[ingress.kafka]
enabled = true
brokers = __KAFKA_BROKERS__
command_topic = "__COMMAND_TOPIC__"
group_id = "__GROUP_ID__"
partition = 0
poll_timeout_ms = 50

[publication]
enabled = false
kafka_topic = "__PUBLICATION_TOPIC__"

[operation]
enabled = true
bind_addr = "__OPERATION_BIND__"

[plugin]
library_path = "__BANK_PLUGIN_DYLIB__"
config_path = "__BANK_PLUGIN_CONFIG__"
expected_runtime_plugin_abi_version = 1
