[package]
name = "statevec-package"
version.workspace = true
edition = "2024"
rust-version = "1.91"
description = "Canonical StateVec Core package authoring and static package checks."
license.workspace = true
repository.workspace = true

[[bin]]
name = "sv-package"
path = "src/main.rs"

[dependencies]
statevec_model.workspace = true
statevec_api.workspace = true
statevec_frame.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Authoring compiles on every Unix; its Linux-only calls refuse elsewhere.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.4", features = ["param"] }

[dev-dependencies]
tempfile.workspace = true
test-case.workspace = true
