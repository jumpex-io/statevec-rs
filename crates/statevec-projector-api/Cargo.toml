[package]
name = "statevec-projector-api"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
description = "Committed business output and checkpoint interfaces for StateVec projectors."
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
statevec_model.workspace = true
statevec_frame.workspace = true
statevec_api.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
test-case.workspace = true
libc.workspace = true
tempfile.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }

[[example]]
name = "projector_v2_delivery"
crate-type = ["cdylib"]

[[example]]
name = "projector_v2_observer"
crate-type = ["cdylib"]

[[example]]
name = "projector_v2_history"
crate-type = ["cdylib"]

[[example]]
name = "projector_v2_latest"
crate-type = ["cdylib"]

# Real latest plugin paused at a physical read or before the native rebuild offer.
[[example]]
name = "projector_v2_latest_probe"
path = "tests/fixtures/latest_probe.rs"
crate-type = ["cdylib"]

# Physical queue/reply faults around the same public history plugin.
[[example]]
name = "projector_v2_history_probe"
path = "tests/fixtures/history_probe.rs"
crate-type = ["cdylib"]

# Qualification fixture, not an application/durability example.
[[example]]
name = "projector_v2_lifecycle_probe"
path = "tests/fixtures/lifecycle_probe.rs"
crate-type = ["cdylib"]
