[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "statevec-local"
version = "0.3.0"
description = "Local process launcher for official StateVec binaries and application plugins"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
statevec-local = "statevec_local.__main__:main"

[tool.setuptools]
packages = ["statevec_local"]
